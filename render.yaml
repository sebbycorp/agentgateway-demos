# Duplicate of 34-render-deploy-agw/render.yaml so the default Deploy-to-Render
# button (no `path` query) still works. Canonical how-to Blueprint Path:
#   34-render-deploy-agw/render.yaml
# Prefer: https://render.com/deploy?repo=https://github.com/sebbycorp/agentgateway-demos&path=34-render-deploy-agw/render.yaml
# Keep this file in sync with 34-render-deploy-agw/render.yaml and deploy/render.yaml.
# https://agentgateway.dev/docs/standalone/latest/setup/install/docker/
services:
  - type: web
    name: agentgateway
    runtime: docker
    plan: starter
    numInstances: 1
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - deploy/**
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: ./deploy
    # /ui/ is basic-auth protected (401 without creds). Omitting
    # healthCheckPath uses Render's TCP listen check on $PORT.
    disk:
      name: agw-config
      mountPath: /config
      sizeGB: 1
    envVars:
      - key: PORT
        value: "4000"
      - key: UI_PASSWORD
        sync: false
      - key: UI_USER
        value: admin
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
