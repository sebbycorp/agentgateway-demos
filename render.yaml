# Duplicate of 34-render-deploy-agw/render.yaml so the default Deploy-to-Render
# button (no `path` query) still works. Canonical how-to Blueprint Path:
#   34-render-deploy-agw/render.yaml
# Prefer: https://render.com/deploy?repo=https://github.com/sebbycorp/agentgateway-demos&path=34-render-deploy-agw/render.yaml
# Keep this file in sync with 34-render-deploy-agw/render.yaml and deploy/render.yaml.
# https://agentgateway.dev/docs/standalone/latest/setup/install/docker/
services:
  - type: web
    name: agentgateway
    runtime: docker
    # Render renamed plans; "starter" still resolves. 0.5c-512mb is the
    # default for a new web service and the smallest plan that can attach a disk.
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - deploy/**
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: ./deploy
    # /ui/ is basic-auth protected (401 without creds). Omitting
    # healthCheckPath uses Render's TCP listen check on $PORT.
    disk:
      name: agw-config
      mountPath: /config
      sizeGB: 1
    envVars:
      - key: PORT
        value: "4000"
      - key: UI_PASSWORD
        sync: false
      - key: UI_USER
        value: admin
      # Provider keys are optional. Add OPENAI_API_KEY / ANTHROPIC_API_KEY /
      # GITHUB_PERSONAL_ACCESS_TOKEN in the Environment tab. sync: false
      # would prompt as required, and a missing $VAR crashes the gateway.
