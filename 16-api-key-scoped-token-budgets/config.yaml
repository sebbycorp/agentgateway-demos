# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Standalone v1.5.0 API-key-scoped token budgets.
# Fields match crates/agentgateway/src/http/budget/mod.rs and LocalAPIKey
# (schema: https://agentgateway.dev/schema/config). Do not invent names.
#
# Budgets live ON the virtual API key, not as a Kubernetes AgentgatewayPolicy.
# They require config.database (SQLite is enough). Usage is charged AFTER the
# LLM response, and only when the provider reports tokens (or cost, for USD).
#
# A USD budget needs a per-model price. The gateway multiplies reported usage by
# config.modelCatalog rates; a model with no entry costs 0.00 and a USD budget
# never moves.
config:
  adminAddr: 0.0.0.0:15000
  database:
    url: sqlite:///data/data.db
  # Cost catalog. Entries merge in order, later ones winning. modelCatalog is
  # the one config block the gateway hot-reloads.
  modelCatalog:
  # Shipped inside the image. Curated, so it has gaps: it prices gpt-5.5 but
  # not gpt-4.1-nano, which is why the sk-demo-nano key below can only be
  # charged once the models.dev layer is present. Absent on the host-binary
  # path, where a missing file is only a warning.
  - file: /base-costs.json
  # Generated by setup.sh: curl https://models.dev/api.json | models-dev-catalog.py
  # (~1000 priced models over the 19 providers the gateway can look up). Not
  # models.dev/models.json — that feed carries no pricing. setup.sh rewrites
  # this path for the host-binary runtime, and drops the entry if the fetch
  # failed and no previous copy is cached.
  - file: /model-catalog.json
gateways:
  llm:
    port: 4000
llm:
  gateways:
  - llm
  policies:
    cors:
      allowOrigins:
      - '*'
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
      - OPTIONS
    apiKey:
      mode: strict
      keys:
      # Tokens budget + Block. One gpt-5.5 answer here runs a few hundred
      # tokens (reasoning included), so 1000 covers roughly two calls: the
      # charge is post-response, so the call that crosses the line still
      # succeeds and the next one in the same epoch-aligned 1h window returns
      # 429 budget_exceeded + Retry-After.
      - key: sk-demo-block
        metadata:
          name: demo-block
          team: demo
        allowedModels:
        - openai/*
        - gpt-5.5
        - gpt-4.1-nano
        budgets:
        - name: tokens
          limit:
            unit: Tokens
            amount: 1000
          window:
            rolling: 1h
          onBudgetExceeded: Block
      # Same limit, Audit: calls keep succeeding while /api/budgets/status
      # still reports used/remaining/exceeded.
      - key: sk-demo-audit
        metadata:
          name: demo-audit
          team: demo
        allowedModels:
        - openai/*
        - gpt-5.5
        - gpt-4.1-nano
        budgets:
        - name: tokens
          limit:
            unit: Tokens
            amount: 1000
          window:
            rolling: 1h
          onBudgetExceeded: Audit
      # Dollar budget — the reason config.modelCatalog above has to be right.
      # Charged as prompt*input_rate + completion*output_rate from the catalog,
      # so it stays 0.00 for any model the catalog cannot price. gpt-5.5 is
      # 5 USD/1M in and 30 USD/1M out, so a ~400-token answer costs roughly
      # 0.012 USD. A 0.02 limit therefore trips after two calls, with usage
      # readable in the UI as 0.012 rather than 0.0000015.
      #
      # NOTE: the gateway expands env-var references over the raw config text,
      # comments included, matching a dollar sign followed by uppercase letters
      # or digits. Never write a bare dollar amount in a comment in this file —
      # it is read as a variable name and startup fails with
      # "environment variable not found". Spell prices out as "USD" instead.
      - key: sk-demo-cost
        metadata:
          name: demo-cost
          team: demo
        allowedModels:
        - openai/*
        - gpt-5.5
        - gpt-4.1-nano
        budgets:
        - name: dollars
          limit:
            unit: USD
            amount: 0.02
          window:
            rolling: 1h
          onBudgetExceeded: Block
      # Same USD budget, but only ever called with gpt-4.1-nano — a model the
      # image's /base-costs.json does not price. Its usage stays 0.00 unless
      # the models.dev catalog layer loaded, which makes this key the direct
      # check on that layer. Audit so it reports rather than blocks.
      - key: sk-demo-nano
        metadata:
          name: demo-nano
          team: demo
        allowedModels:
        - openai/gpt-4.1-nano
        - gpt-4.1-nano
        budgets:
        - name: dollars
          limit:
            unit: USD
            amount: 0.02
          window:
            rolling: 1h
          onBudgetExceeded: Audit
  models:
  # gpt-5.5 is a reasoning model: callers must send max_completion_tokens, not
  # max_tokens (OpenAI rejects the latter), and reasoning tokens are billed
  # inside completion_tokens. Catalog rates are 5 USD/1M in, 30 USD/1M out,
  # with a second tier above 272k context.
  - name: openai/gpt-5.5
    provider: openAI
    params:
      model: gpt-5.5
      apiKey: $OPENAI_API_KEY
  # Priced by the models.dev layer only. Takes plain max_tokens.
  - name: openai/gpt-4.1-nano
    provider: openAI
    params:
      model: gpt-4.1-nano
      apiKey: $OPENAI_API_KEY
  - name: openai/*
    provider: openAI
    params:
      model: gpt-5.5
      apiKey: $OPENAI_API_KEY
