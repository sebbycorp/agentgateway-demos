# Duplicate of 34-render-deploy-agw/render.yaml (image pack copy).
# Canonical how-to Blueprint Path: 34-render-deploy-agw/render.yaml
# Deploy button: path=34-render-deploy-agw/render.yaml
# Keep in sync with 34-render-deploy-agw/render.yaml and /render.yaml.
# https://agentgateway.dev/docs/standalone/latest/setup/install/docker/
#
# Paths are relative to the repo root (Render Blueprint spec).
services:
  - type: web
    name: agentgateway
    runtime: docker
    # Render renamed plans; "starter" still resolves. 0.5c-512mb is the
    # default for a new web service and the smallest plan that can attach a disk.
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - deploy/**
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: ./deploy
    # /ui/ is basic-auth protected (401 without creds). TCP-style default
    # (omit healthCheckPath) treats a listening :4000 as healthy.
    disk:
      name: agw-config
      mountPath: /config
      sizeGB: 1
    envVars:
      # Render routes public HTTP to $PORT (default 10000). The generated
      # gateway listens on 4000 — pin PORT so they match.
      - key: PORT
        value: "4000"
      # Required. Render prompts on first Blueprint create.
      # sync: false is not allowed inside envVarGroups (Render docs).
      - key: UI_PASSWORD
        sync: false
      # Optional; entrypoint defaults to admin when unset.
      - key: UI_USER
        value: admin
      # Provider keys are optional. Do not declare OPENAI_API_KEY,
      # ANTHROPIC_API_KEY, or GITHUB_PERSONAL_ACCESS_TOKEN with sync: false —
      # Render would prompt as required on Blueprint create, and the
      # gateway exits if config.yaml expands a $VAR that is unset.
      # Add them later in the Environment tab to seed OpenAI / GitHub MCP.
